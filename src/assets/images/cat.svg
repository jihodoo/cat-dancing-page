<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cat Body -->
  <ellipse cx="100" cy="120" rx="50" ry="60" fill="#ff9f4a" stroke="#000" stroke-width="2"/>

  <!-- Cat Head -->
  <circle cx="100" cy="70" r="40" fill="#ff9f4a" stroke="#000" stroke-width="2"/>

  <!-- Left Ear -->
  <polygon points="75,45 70,20 85,40" fill="#ff9f4a" stroke="#000" stroke-width="2"/>
  <polygon points="75,45 72,28 80,40" fill="#ffb366"/>

  <!-- Right Ear -->
  <polygon points="125,45 130,20 115,40" fill="#ff9f4a" stroke="#000" stroke-width="2"/>
  <polygon points="125,45 128,28 120,40" fill="#ffb366"/>

  <!-- Left Eye -->
  <ellipse cx="85" cy="65" rx="8" ry="12" fill="#000"/>
  <ellipse cx="87" cy="63" rx="3" ry="5" fill="#fff"/>

  <!-- Right Eye -->
  <ellipse cx="115" cy="65" rx="8" ry="12" fill="#000"/>
  <ellipse cx="117" cy="63" rx="3" ry="5" fill="#fff"/>

  <!-- Nose -->
  <polygon points="100,75 95,82 105,82" fill="#ff6b9d"/>

  <!-- Mouth -->
  <path d="M 100 82 Q 90 88 85 85" stroke="#000" stroke-width="2" fill="none"/>
  <path d="M 100 82 Q 110 88 115 85" stroke="#000" stroke-width="2" fill="none"/>

  <!-- Whiskers Left -->
  <line x1="60" y1="70" x2="40" y2="68" stroke="#000" stroke-width="1.5"/>
  <line x1="60" y1="75" x2="40" y2="75" stroke="#000" stroke-width="1.5"/>
  <line x1="60" y1="80" x2="40" y2="82" stroke="#000" stroke-width="1.5"/>

  <!-- Whiskers Right -->
  <line x1="140" y1="70" x2="160" y2="68" stroke="#000" stroke-width="1.5"/>
  <line x1="140" y1="75" x2="160" y2="75" stroke="#000" stroke-width="1.5"/>
  <line x1="140" y1="80" x2="160" y2="82" stroke="#000" stroke-width="1.5"/>

  <!-- Left Arm -->
  <ellipse cx="70" cy="130" rx="12" ry="30" fill="#ff9f4a" stroke="#000" stroke-width="2"/>

  <!-- Right Arm -->
  <ellipse cx="130" cy="130" rx="12" ry="30" fill="#ff9f4a" stroke="#000" stroke-width="2"/>

  <!-- Left Leg -->
  <ellipse cx="85" cy="165" rx="10" ry="25" fill="#ff9f4a" stroke="#000" stroke-width="2"/>

  <!-- Right Leg -->
  <ellipse cx="115" cy="165" rx="10" ry="25" fill="#ff9f4a" stroke="#000" stroke-width="2"/>

  <!-- Tail -->
  <path d="M 145 120 Q 165 110 170 130 Q 175 150 160 155" stroke="#000" stroke-width="2" fill="#ff9f4a"/>

  <!-- Belly -->
  <ellipse cx="100" cy="135" rx="25" ry="35" fill="#ffcc99"/>
</svg>
